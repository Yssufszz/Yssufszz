<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <style>
    /* Teks Neon */
    .neon-text {
      font: bold 60px 'Segoe UI', sans-serif;
      fill: none;
      stroke: #00CFFF;
      stroke-width: 4;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 2.5s ease-out forwards, glow 2s ease-in-out infinite alternate, glitch 3s infinite;
      filter: drop-shadow(0 0 10px #00CFFF) drop-shadow(0 0 20px #00CFFF) drop-shadow(0 0 30px #00CFFF)
              drop-shadow(0 0 50px #00CFFF) drop-shadow(0 0 70px #00CFFF); /* Efek shadow intens */
    }

    /* Animasi untuk menggambar teks */
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Efek glow neon dengan biru terang */
    @keyframes glow {
      0% {
        stroke: #00CFFF;
        filter: drop-shadow(0 0 6px #00CFFF) drop-shadow(0 0 20px #00CFFF) drop-shadow(0 0 40px #00CFFF);
      }
      50% {
        stroke: #00AACC;
        filter: drop-shadow(0 0 12px #00AACC) drop-shadow(0 0 25px #00AACC) drop-shadow(0 0 60px #00AACC);
      }
      100% {
        stroke: #00CFFF;
        filter: drop-shadow(0 0 6px #00CFFF) drop-shadow(0 0 20px #00CFFF) drop-shadow(0 0 40px #00CFFF);
      }
    }

    /* Efek glitch pada teks */
    @keyframes glitch {
      0% {
        transform: translate(0);
        filter: brightness(100%);
      }
      15% {
        transform: translate(-5px, 0);
        filter: brightness(120%);
      }
      30% {
        transform: translate(5px, 0);
        filter: brightness(80%);
      }
      45% {
        transform: translate(-2px, 0);
        filter: brightness(100%);
      }
      60% {
        transform: translate(2px, 0);
        filter: brightness(90%);
      }
      75% {
        transform: translate(0, 0);
        filter: brightness(100%);
      }
      100% {
        transform: translate(0);
        filter: brightness(100%);
      }
    }

    /* Garis Neon */
    .neon-line {
      fill: none;
      stroke: #003366; /* Biru gelap */
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: neon-line 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 10px #003366) drop-shadow(0 0 20px #003366);
    }

    /* Animasi untuk garis neon */
    @keyframes neon-line {
      0% {
        opacity: 0.8;
        filter: drop-shadow(0 0 10px #003366);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 25px #003366) drop-shadow(0 0 35px #003366);
      }
      100% {
        opacity: 0.8;
        filter: drop-shadow(0 0 10px #003366);
      }
    }

    svg {
      background: #121212;
    }
  </style>

  <!-- Teks Neon Yssufszz dengan glitch dan animasi -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="neon-text">
    Yssufszz
  </text>

  <!-- Garis Neon Biru Gelap -->
  <line x1="50" y1="160" x2="750" y2="160" class="neon-line"/>
</svg>
